name: Deploy Perfeed

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: perfeed-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Настроить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Настроить SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PERFEED_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PERFEED_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Задеплоить сайт
        run: .codex/skills/deploy-perfeed/scripts/deploy.sh "$GITHUB_WORKSPACE"
